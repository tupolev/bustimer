name: Tests and JavaScript checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks and JavaScript tests
        run: npm run ci
      - name: Validate PHP backend syntax
        run: |
          for f in server/*.php; do php -l "$f"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: VRS GTFS importer fixture tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

