name: Audit Netherlands GTFS (optional, manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch national GTFS (bounded)
        run: |
          curl --fail --location --retry 2 --max-time 900 --output "$RUNNER_TEMP/nl.zip" https://gtfs.ovapi.nl/nl/gtfs-nl.zip
          test "$(stat -c %s "$RUNNER_TEMP/nl.zip")" -lt 400000000
      - name: Inspect archive without publishing schedules
        run: python3 scripts/inspect_netherlands.py "$RUNNER_TEMP/nl.zip" --report "$RUNNER_TEMP/nl-report.json"
      - name: Compile staged Netherlands timetable shards
        run: python3 scripts/build_netherlands.py "$RUNNER_TEMP/nl.zip" --out "$RUNNER_TEMP/nl-stage"
      - name: Verify staged index and schedules
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"nl-stage"
          report=json.loads((d/"validation.json").read_text())
          index=json.loads((d/"search.json").read_text())
          assert report["stops"]>=1000
          assert len(index["stops"])==report["stops"]
          for stop in index["stops"][:100]:
              assert (d/"stops"/(stop["file"]+".json")).is_file()
          print(report)
          PY
      - name: Measure publishable dataset footprint
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"nl-stage"
          files=list(d.rglob("*.json"))
          bytes_total=sum(f.stat().st_size for f in files)
          report={"json_files":len(files),"json_bytes":bytes_total,"largest_file_bytes":max(f.stat().st_size for f in files)}
          (Path(os.environ["RUNNER_TEMP"])/"nl-footprint.json").write_text(json.dumps(report,indent=2)+"\\n")
          print(report)
          assert report["json_files"]>=1000
          assert report["largest_file_bytes"]<100_000_000
          PY
      - name: Publish validation evidence (no timetable dataset)
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          inspect = json.loads((root / "nl-report.json").read_text())
          compiled = json.loads((root / "nl-stage/validation.json").read_text())
          footprint = json.loads((root / "nl-footprint.json").read_text())
          report = {
            "validated_at": datetime.now(timezone.utc).isoformat(),
            "run_id": os.environ["GITHUB_RUN_ID"],
            "commit": os.environ["GITHUB_SHA"],
            "inspection": inspect,
            "compiled": compiled,
            "footprint": footprint,
            "browser_enabled": False,
          }
          path = Path("docs/validation/netherlands-latest.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/netherlands-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "test(nl): publish national feed validation evidence"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: netherlands-gtfs-inspection
          path: |
            ${{ runner.temp }}/nl-footprint.json
            ${{ runner.temp }}/nl-report.json
            ${{ runner.temp }}/nl-stage/validation.json
            ${{ runner.temp }}/nl-stage/search.json
          retention-days: 14
