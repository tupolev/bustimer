name: Germany Spain API coverage audit (manual + one-off)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/germany-spain-audit.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sample direct HTTPS stop searches and departures
        run: python3 scripts/audit_germany_spain.py
      - name: Publish diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/germany-spain-api-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "test: record Germany Spain API sample coverage"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
