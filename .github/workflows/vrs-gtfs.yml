name: Refresh VRS scheduled timetables
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile official VRS GTFS
        run: python3 scripts/build_vrs.py
      - name: Validate generated index
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/vrs/index.json").read_text())
          assert len(x["stops"])>100
          assert x["timezone"]=="Europe/Berlin"
          print(len(x["stops"]),"VRS stops")
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vrs
          git diff --cached --quiet || (git commit -m "data: refresh official VRS timetables" && git push)
