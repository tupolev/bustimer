name: Refresh VRS scheduled timetables
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile official VRS GTFS
        run: python3 scripts/build_vrs.py
      - name: Validate generated index
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/vrs/index.json").read_text())
          assert len(x["stops"])>100
          assert x["timezone"]=="Europe/Berlin"
          print(len(x["stops"]),"VRS stops")
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vrs
          if ! git diff --cached --quiet; then
            git -c advice.statusHints=false commit --quiet -m "data: refresh official VRS timetables"
            # The application may receive commits while this long-running import
            # executes. Rebase the generated data onto the latest main and retry
            # without ever force pushing or dropping other people's commits.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Main advanced during upload; retrying ($attempt/5)"
              sleep 3
            done
            echo "Could not publish VRS dataset after retries" >&2
            exit 1
          fi
