name: Live Pages browser smoke (one-off)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-pages-smoke.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Chromium against published Pages and Transitous
        id: smoke
        continue-on-error: true
        run: npx playwright test e2e/netherlands-live-pages.spec.mjs --retries=1
      - name: Persist live-browser outcome
        if: always() && steps.smoke.outcome != 'skipped'
        env:
          RESULT: ${{ steps.smoke.outcome }}
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          from datetime import datetime,timezone
          dest=Path("docs/validation/live-pages-browser-latest.json")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps({"checked_at":datetime.now(timezone.utc).isoformat(),"run_id":os.environ["GITHUB_RUN_ID"],"commit":os.environ["GITHUB_SHA"],"result":os.environ["RESULT"],"origin":"https://tupolev.github.io/bustimer/","type":"real Chromium CORS + Transitous stop-times"},indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/live-pages-browser-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "test(nl): record deployed Pages browser smoke"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-pages-smoke-traces
          path: test-results/
      - name: Fail unsuccessful test
        if: steps.smoke.outcome == 'failure'
        run: exit 1
