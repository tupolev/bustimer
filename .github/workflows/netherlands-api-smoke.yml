name: Netherlands API smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/netherlands-api-smoke.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real Transitous stop queries and browser CORS
        run: python3 scripts/smoke_netherlands_api.py --report docs/validation/netherlands-api-latest.json
      - name: Publish evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/netherlands-api-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "test(nl): record live API smoke evidence"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
