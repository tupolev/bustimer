name: New Countries API Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/new-countries-api.yml"
      - "scripts/audit_next_countries.py"
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify nearby stop-times from real APIs
        run: python3 scripts/audit_next_countries.py
      - name: Publish sample evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/next-countries-api.json
          if ! git diff --cached --quiet; then
            git commit -m "test(expansion): publish four-country API samples"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
