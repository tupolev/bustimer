name: Publish Luxembourg official GTFS
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate importer with synthetic fixtures
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Download and compile current official Luxembourg GTFS
        run: python3 scripts/build_luxembourg.py --out "$RUNNER_TEMP/luxembourg"
      - name: Validate staged dataset
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"luxembourg"
          search=json.loads((root/"search.json").read_text())
          services=json.loads((root/"services.json").read_text())
          assert len(search["stops"])>=100
          assert search["timezone"]=="Europe/Luxembourg"
          assert services["calendar"] or services["exceptions"]
          assert all((root/"stops"/(s["file"]+".json")).exists() for s in search["stops"])
          print(f'VALIDATED: {len(search["stops"])} Luxembourg stops; {len(services["calendar"])} calendars')
          PY
      - name: Commit validated Luxembourg schedules
        run: |
          rm -rf data/luxembourg
          mkdir -p data
          cp -a "$RUNNER_TEMP/luxembourg" data/luxembourg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/luxembourg
          if ! git diff --cached --quiet; then
            git commit --quiet -m "data: publish official Luxembourg GTFS schedules"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - name: Upload validation index for inspection
        uses: actions/upload-artifact@v4
        with:
          name: luxembourg-validation-index
          path: |
            ${{ runner.temp }}/luxembourg/search.json
            ${{ runner.temp }}/luxembourg/services.json
          retention-days: 7
