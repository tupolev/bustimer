name: Refresh Málaga EMT timetables
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and compile official EMT GTFS
        run: python3 scripts/build_malaga.py
      - name: Commit updated static schedules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/malaga
          git diff --cached --quiet || (git commit -m "data: refresh official Málaga EMT timetables" && git push)
