name: Deploy BusTimer to DreamHost
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dreamhost-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dreamhost-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application
        run: npm run ci
      - name: Validate PHP sources
        run: |
          for f in server/*.php; do php -l "$f"; done
      - name: Install PHP production dependencies
        run: composer install --working-dir=server --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Verify Web Push HTTP client is instantiable
        run: |
          php -r 'require "server/vendor/autoload.php"; if (!(Http\Discovery\Psr18ClientDiscovery::find() instanceof Psr\Http\Client\ClientInterface)) exit(1);'
      - name: Verify Web Push subscription class
        run: |
          php -r 'require "server/vendor/autoload.php"; if (!class_exists("Minishlink\\WebPush\\Subscription")) exit(1);'
      - name: Prepare deployable files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/server
          cp index.html sw.js icon.svg manifest.webmanifest countries.json .nojekyll stage/
          cp -a data i18n stage/
          cp server/*.php server/composer.json server/.htaccess stage/server/
          cp -a server/vendor stage/server/vendor
          # Never ship local private credentials, database or runtime state.
          test ! -e stage/server/settings.php
          test ! -d stage/server/private
          test -f stage/server/vendor/autoload.php
      - name: Install SSH password helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Configure verified SSH host
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DREAMHOST_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify remote PHP runtime and destination
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DREAMHOST_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DREAMHOST_WEB_ROOT }}
          SSHPASS: ${{ secrets.DREAMHOST_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PATH" && test -n "$SSHPASS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PATH" == "/home/$DEPLOY_USER/bustimer.kodesoft.net/" ]]
          remote_php=$(sshpass -e ssh -o StrictHostKeyChecking=yes -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive "$DEPLOY_USER@$DEPLOY_HOST" 'php -r "echo PHP_VERSION_ID;"')
          [[ "$remote_php" =~ ^[0-9]+$ ]] && (( remote_php >= 80200 )) || { echo "DreamHost CLI PHP 8.2+ required (got $remote_php)"; exit 1; }
          for extension in pdo_sqlite curl openssl mbstring; do
            sshpass -e ssh -o StrictHostKeyChecking=yes -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive "$DEPLOY_USER@$DEPLOY_HOST" \
              "php -r \"exit(extension_loaded('$extension') ? 0 : 1);\"" || { echo "DreamHost PHP missing $extension"; exit 1; }
          done
          sshpass -e ssh -o StrictHostKeyChecking=yes -o BatchMode=no -o PreferredAuthentications=password,keyboard-interactive "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'"
      - name: Incremental upload of changed release files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DREAMHOST_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DREAMHOST_WEB_ROOT }}
          SSHPASS: ${{ secrets.DREAMHOST_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PATH" && test -n "$SSHPASS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PATH" == "/home/$DEPLOY_USER/bustimer.kodesoft.net/" ]]
          # Composer rebuilds vendor/ on each run, changing timestamps even if bytes match.\n          # --checksum skips identical file contents; --delay-updates stages changed files\n          # and renames them into place when transfer completes. Never delete remote files.\n          rsync -az --checksum --delay-updates --omit-dir-times --itemize-changes --stats --no-perms --no-owner --no-group \
            --exclude='server/settings.php' \
            --exclude='server/private/' \
            --exclude='*.sqlite' --exclude='*.sqlite-shm' --exclude='*.sqlite-wal' \
            -e 'sshpass -e ssh -o StrictHostKeyChecking=yes -o PreferredAuthentications=password,keyboard-interactive' \
            stage/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Verify deployed PWA and report PHP configuration state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            --output /tmp/bustimer-index.html 'https://bustimer.kodesoft.net/'
          grep -qi 'bustimer' /tmp/bustimer-index.html
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            --output /tmp/bustimer-sw.js 'https://bustimer.kodesoft.net/sw.js'
          grep -q 'bustimer-shell' /tmp/bustimer-sw.js
          # PHP settings.php/VAPID are intentionally server-side, provisioned separately.
          # Distinguish missing configuration (500) from an absent PHP endpoint (404).
          api_status=$(curl --silent --show-error --output /tmp/bustimer-api.json \
            --write-out '%{http_code}' 'https://bustimer.kodesoft.net/server/api.php?action=config')
          if [[ "$api_status" == "200" ]]; then
            python3 -c 'import json; d=json.load(open("/tmp/bustimer-api.json")); assert d.get("enabled") is True and isinstance(d.get("publicKey"),str) and len(d["publicKey"]) > 20'
            echo 'PWA deployed. PHP Web Push API configured.'
          elif [[ "$api_status" == "500" || "$api_status" == "503" ]]; then
            echo "::warning::PWA deployed; PHP Web Push API is not yet configured or available (HTTP $api_status). Configure private settings.php and VAPID before enabling push alarms."
          else
            echo "::error::Unexpected API HTTP status: $api_status"
            exit 1
          fi
